name: 매일 리더보드 업데이트

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 한국 시간 오전 9시 (GitHub 사정으로 몇 분~수십 분 늦을 수 있어요)
  workflow_dispatch:       # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright 설치
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: 전날 판 가져오기
        run: python scripts/fetch_playaram.py

      - name: 점수 다시 계산
        run: python scripts/score.py

      - name: 변경 사항 커밋
        run: |
          git config user.name "aram-bot"
          git config user.email "aram-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "리더보드 업데이트 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
